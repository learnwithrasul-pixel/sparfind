<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SPARFIND">
  <!--
    Tab-Icon. Es wird meistens mit 16 Pixeln gezeichnet, also traegt es nur
    das, was bei 16 Pixeln noch etwas bedeutet: der Ring mit Griff sagt
    "suchen", der Farbverlauf sagt SPARFIND. Der Einkaufswagen sitzt bewusst
    grob und dick im Ring — bei 16 Pixeln bleibt davon eine Andeutung, bei
    32 und mehr ist er zu erkennen. Feinere Linien waeren dort nur Matsch.
  -->
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb03b"/>
      <stop offset="1" stop-color="#ff4d2b"/>
    </linearGradient>
    <!-- userSpaceOnUse, weil die Tempo-Striche waagerecht sind: ihr
         Bounding-Box ist null Pixel hoch, und ein Verlauf in
         objectBoundingBox-Einheiten laesst sich darauf nicht berechnen —
         der Strich verschwindet dann einfach. -->
    <linearGradient id="mint" gradientUnits="userSpaceOnUse" x1="13" y1="28" x2="24" y2="28">
      <stop offset="0" stop-color="#31d0aa"/>
      <stop offset="1" stop-color="#8fe36a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#12151d"/>

  <!-- Griff zuerst, damit der Ring sauber darueber liegt -->
  <path d="M40.5 40.5 L53 53" stroke="url(#warm)" stroke-width="8" stroke-linecap="round"/>

  <!-- Lupenring -->
  <circle cx="27" cy="27" r="16" fill="none" stroke="url(#warm)" stroke-width="6.5"/>

  <!-- Tempo-Striche links: die drei gruenen Linien aus dem Logo -->
  <g stroke="url(#mint)" stroke-width="3.4" stroke-linecap="round">
    <path d="M14.5 22.5 h6"/>
    <path d="M16.5 28 h5"/>
    <path d="M18.5 33.5 h4"/>
  </g>

  <!-- Einkaufswagen, auf das Noetigste reduziert -->
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 20.5 h2.6 l3.4 11 h9.6 l2.4-7.6 H27.6"/>
  </g>
  <circle cx="30.5" cy="35.8" r="2.1" fill="#ffffff"/>
  <circle cx="37.8" cy="35.8" r="2.1" fill="#ffffff"/>
</svg>
