# Decap CMS — Admin-Panel unter https://sparfind.de/admin/
#
# Login laeuft ueber Decap Turbo (gehostet von Decap selbst). Dadurch braucht
# die Seite keinen eigenen OAuth-Server, und im Repo liegt kein Token.
# Jede Speicherung im Panel = ein Commit auf `main` -> GitHub Pages baut neu
# (dauert ca. 1 Minute).
backend:
  name: turbo-github
  turbo_site_id: 1ffbece9-6fa0-4dee-bfb9-78e9d13fca67
  branch: main

# Nur fuer die lokale Vorschau (http://localhost): `npx decap-server` starten,
# dann geht das Panel ohne Login direkt auf die Dateien auf der Platte.
# Auf sparfind.de hat diese Zeile keine Wirkung.
local_backend: true

locale: de

media_folder: bilder
public_folder: /bilder

# Bewusst NICHT im Panel: deals.js. Die Datei schreibt das Skript
# (YAYINLA.bat / tools/build-deals.js) — zwei Schreiber auf einer Datei
# wuerden sich gegenseitig ueberschreiben. Produkte aus dem Panel landen
# deshalb in einer eigenen Datei (content/produkte.json); die Seite zeigt
# beide Quellen zusammen.
collections:
  - name: produkte
    label: Produkte
    files:
      - name: liste
        label: Produktliste
        file: content/produkte.json
        fields:
          - name: produkte
            label: Produkte
            label_singular: Produkt
            widget: list
            summary: "{{fields.title}} — {{fields.price}} €"
            fields:
              - { name: title, label: "Produktname", widget: string }
              - name: category
                label: Kategorie
                widget: select
                options:
                  - { label: "Homeoffice", value: buero }
                  - { label: "Haushalt", value: haushalt }
                  - { label: "Technik", value: technik }
                  - { label: "Beauty", value: beauty }
                  - { label: "Auto", value: auto }
                  - { label: "Reise", value: reise }
                  - { label: "Sport", value: sport }
                  - { label: "Taschen", value: mode }
                  - { label: "Mobilität", value: mobilitaet }
                  - { label: "Küche", value: kueche }
                  - { label: "Werkzeug", value: werkzeug }
                  - { label: "Garten", value: garten }
              - name: merchant
                label: Händler
                widget: select
                options:
                  - { label: "Amazon", value: amazon }
                  - { label: "AliExpress", value: aliexpress }
                  - { label: "Temu", value: temu }
              - name: price
                label: "Preis (€)"
                widget: number
                value_type: float
                min: 0
                step: 0.01
                required: false
                hint: "Leer lassen, wenn unbekannt — die Karte zeigt dann „Preis beim Händler prüfen“."
              - name: listPrice
                label: "Alter Preis (durchgestrichen)"
                widget: number
                value_type: float
                min: 0
                step: 0.01
                required: false
                hint: "NUR eintragen, wenn der Händler diesen Preis selbst durchgestrichen zeigt."
              - name: checkedAt
                label: "Preis geprüft am"
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: "DD.MM.YYYY"
                time_format: false
              - { name: url, label: "Link zum Produkt", widget: string }
              - { name: affUrl, label: "Partnerlink (falls anders)", widget: string, required: false }
              - { name: image, label: "Bild", widget: image, required: false }
              - { name: note, label: "Kurzbeschreibung", widget: text, required: false }

  - name: seiten
    label: Seiten
    files:
      - name: startseite
        label: Startseite (oberer Teil)
        file: content/startseite.json
        fields:
          - { name: titel1, label: "Überschrift, Zeile 1", widget: string }
          - { name: titel2, label: "Überschrift, Zeile 2 (farbig)", widget: string }
          - { name: intro, label: "Text unter der Überschrift", widget: text }
